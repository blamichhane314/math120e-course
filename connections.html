<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>math 120e · connections</title>
<link rel=stylesheet href="vendor/katex/katex.min.css">
<link rel=stylesheet href="styles.css?v=53">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("m120.theme")||"ink"}catch(e){}</script>
<body class=no-rail>
<div id=read><div id=doc>
  <a class=home href="index.html">math 120e</a>
  <h1><span class=num>connections</span>How the ideas depend on each other</h1>
  <div id=views></div>
  <div id=ch hidden></div>
  <div id=picker></div>
  <div id=nb></div>
  <div id=tl hidden></div>
</div></div>
<div id=margin></div>

<script defer src="vendor/katex/katex.min.js"></script>
<script type=module>
import { mountGraph, buildGraph, mountMatrix, mountChapters } from './js/graph.js?v=29';

const raw = await (await fetch('data/graph_provisional.json', {cache:'no-store'})).json();

// worked examples for a pair, where one has been written
let BRIDGES = {};
try { BRIDGES = await (await fetch('data/bridges.json', {cache:'no-store'})).json(); } catch {}

// the practice written for each objective, grouped by objective id
const PRACTICE = {};
for (const f of ['q_a','q_b','q_c']) {
  try {
    const j = await (await fetch('data/' + f + '.json', {cache:'no-store'})).json();
    for (const sec of Object.keys(j)) for (const q of j[sec]) (PRACTICE[q.obj] ||= []).push(q);
  } catch {}
}
for (const k of Object.keys(PRACTICE)) {
  PRACTICE[k].sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
}

// tex() needs KaTeX present before the first render
await new Promise((r) => (window.katex ? r() : addEventListener('load', r)));

// Round 1 is claims, not yet reconciled. A pair claimed from BOTH ends is
// already mutually confirmed; one claimed from a single end is provisional.
// Merge duplicates, keeping the stronger type and marking confirmation.
const byPair = new Map();
for (const e of raw.edges) {
  const k = e.from + '>' + e.to;
  const prev = byPair.get(k);
  if (!prev) { byPair.set(k, { ...e, ends: new Set([e.claimedBy]) }); continue; }
  prev.ends.add(e.claimedBy);
  if (e.type === 'requires') prev.type = 'requires';
  if (!prev.why && e.why) prev.why = e.why;
}
const edges = [...byPair.values()].map(e => ({ ...e, confirmed: e.ends.size > 1 }));
const G = buildGraph(raw.nodes, edges);

const nb = document.getElementById('nb');

// Objectives in course order. Step with prev/next, or jump with the list.
const ORDER = raw.nodes.filter(n => G.nodes[n.id]).map(n => n.id);
let at = 0;

const picker = document.getElementById('picker');
picker.innerHTML =
  '<div class=stepper>' +
    '<button class=sbtn id=gprev title="previous objective">&lsaquo;&nbsp;prev</button>' +
    '<span class=spos id=gpos></span>' +
    '<button class=sbtn id=gnext title="next objective">next&nbsp;&rsaquo;</button>' +
    '<select id=gjump class=jump title="jump to an objective"></select>' +
  '</div>';

const sel = document.getElementById('gjump');
for (const id of ORDER) {
  const n = G.nodes[id];
  const o = document.createElement('option');
  o.value = id;
  o.textContent = id + ' — ' + n.text;
  sel.appendChild(o);
}

function show(id) {
  const i = ORDER.indexOf(id);
  at = i < 0 ? at : i;
  const cur = ORDER[at];
  sel.value = cur;
  document.getElementById('gpos').innerHTML =
    (at + 1) + ' <i>/</i> ' + ORDER.length;
  mountGraph(nb, G, cur, { bridges: BRIDGES, practice: PRACTICE, onFocus: show,
    onSection: (s) => window.open('index.html#/' + s, '_blank') });
  location.replace('#' + cur);
}
const step = (d) => show(ORDER[(at + d + ORDER.length) % ORDER.length]);

addEventListener('hashchange', () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && id !== ORDER[at]) show(id);
});

document.getElementById('gprev').onclick = () => step(-1);
document.getElementById('gnext').onclick = () => step(1);
sel.addEventListener('change', () => show(sel.value));
addEventListener('keydown', (e) => {
  if (/input|select|textarea/i.test(e.target.tagName || '')) return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});

document.getElementById('views').innerHTML =
  '<div class=stepper>' +
    '<button class=sbtn id=vch>chapters</button>' +
    '<button class=sbtn id=vtl>sections</button>' +
    '<button class="sbtn on" id=vnb>objective</button>' +
  '</div>';
const nbBox = document.getElementById('nb'), tlBox = document.getElementById('tl'),
      chBox = document.getElementById('ch'), pickBox = document.getElementById('picker');
let tlUp = false, chUp = false;

function view(which) {
  chBox.hidden = which !== 'ch';
  tlBox.hidden = which !== 'tl';
  nbBox.hidden = which !== 'nb';
  pickBox.hidden = which !== 'nb';
  for (const [id, w] of [['vch','ch'],['vtl','tl'],['vnb','nb']])
    document.getElementById(id).classList.toggle('on', which === w);
  if (which === 'ch' && !chUp) { mountChapters(chBox, G); chUp = true; }
  if (which === 'tl' && !tlUp) {
    mountMatrix(tlBox, G, { onCell: ([a]) => {
      const first = ORDER.find((id) => G.nodes[id].section === a);
      if (first) { view('nb'); show(first); }
    } });
    tlUp = true;
  }
}
document.getElementById('vch').onclick = () => view('ch');
document.getElementById('vtl').onclick = () => view('tl');
document.getElementById('vnb').onclick = () => view('nb');

show(decodeURIComponent(location.hash.slice(1)) || ORDER[0]);
document.title = 'math 120e · connections';
</script>
<script type=module>
import { mountThemes } from './js/theme.js?v=2';
mountThemes();
</script>
</body>
</html>
