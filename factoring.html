   to deep blue as the work goes on. The sky ABOVE stays deep at every stage,
   because that is where the type sits — only the horizon changes colour. */

:root[data-scene=dusk][data-stage="1"]{--pl-sky2:#372d4d; --pl-sky:#a55c4e; --pl-halo:#3a3051;}

.figlab{font:italic 11px "Space Grotesk",serif;fill:var(--ink-soft)}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:calc(var(--s)*4);align-items:start}
.qcol{min-width:0}
.fig{display:block;height:auto;flex:0 0 auto}
.item.haswrap{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:calc(var(--s)*3);align-items:start}
.item.haswrap .fig{grid-column:2;grid-row:1/span 9;align-self:start}
.fig.sm{transform:scale(.62);transform-origin:right top}
@media (max-width:640px){
  .qwrap,.item.haswrap{grid-template-columns:1fr}
  .fig{margin-top:calc(var(--s)*2)}
}
.fx{margin-top:calc(var(--s)*2)}
.fxsteps{display:flex;flex-direction:column;gap:calc(var(--s)*1.5)}
.fxstep{display:flex;flex-wrap:wrap;align-items:center;gap:4px;
  font-family:var(--sans);font-size:18px;color:var(--ink-soft);opacity:.5;
  transition:opacity .2s var(--ease)}
.fxstep.now{opacity:1;color:var(--ink)}
.fxstep.tidy{font-size:21px}
.fxstep.tidy .fxpull,.fxstep.tidy .fxgrp.brk{padding-top:6px;padding-bottom:6px}
.fxstep:not(.tidy).now ~ .fxstep.tidy{opacity:1}
.fxeq{color:var(--ink-faint);padding-right:8px;font-size:17px}

/* a term is one visible object */
.fxterm{display:inline-flex;align-items:center;gap:2px;
  padding:5px 9px;border:1px solid var(--line);border-radius:4px;
  background:var(--pl-halo)}
.fxterm.done{border-style:dashed;color:var(--ink-faint)}
.fxstep.now .fxterm.shut{cursor:pointer;border:1px dashed var(--accent-soft)}
.fxstep.now .fxterm.shut:hover{border-color:var(--accent);background:var(--accent-tint)}
.fxplus{color:var(--ink-faint);padding:0 10px;font-size:17px}

/* the bracket is drawn, so it visibly spans both terms */
.fxgrp{display:inline-flex;align-items:center;gap:2px;padding:2px}
.fxgrp.brk{padding:7px 12px;border-left:2px solid var(--ink-faint);
  border-right:2px solid var(--ink-faint);border-radius:14px/50%}

/* the factor written once, out front */
.fxpull{display:inline-flex;align-items:center;gap:2px;margin-right:6px;
  padding:5px 9px;border:1px solid var(--accent);border-radius:4px;
  background:var(--accent-tint);color:var(--accent)}

.fxx{display:inline-block;padding:1px 4px;border-radius:2px}
.fxx i{font-style:italic}
.fxdot{color:var(--ink-faint);padding:0 1px;font-size:13px}
.fxone{padding:1px 4px}
.fxstep.now .fxx.live{cursor:pointer;box-shadow:inset 0 -2px 0 var(--accent-soft)}
.fxstep.now .fxx.live:hover{color:var(--accent);background:var(--accent-tint);
  box-shadow:inset 0 -2px 0 var(--accent)}
/* the chip that moves to the front on the next line */
.fxx.moving{color:var(--accent);background:var(--accent-tint);
  box-shadow:inset 0 -2px 0 var(--accent)}

.fxbtns{display:flex;gap:6px;margin-top:calc(var(--s)*2.5)}
.fxb{font:inherit;font-size:12.5px;background:none;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:4px 12px;cursor:pointer}
.fxb:hover:not([disabled]){color:var(--accent);border-color:var(--accent)}
.fxb[disabled]{opacity:.3;cursor:default}
.fxhint{margin-top:calc(var(--s)*1.5);font:10px/1.6 var(--mono);
  letter-spacing:.12em;color:var(--ink-faint)}

.asp{margin-top:calc(var(--s)*2)}
.arow{display:flex;flex-wrap:wrap;gap:5px}
.ac{font:9.5px/1.6 var(--mono);letter-spacing:.08em;color:var(--ink-faint);
  background:none;border:1px solid var(--line-soft);border-radius:2px;
  padding:2px 7px;cursor:pointer;
  transition:color .12s var(--ease),border-color .12s var(--ease)}
.ac:hover{color:var(--accent);border-color:var(--accent-soft)}
.ac.lit{color:var(--accent);border-color:var(--accent)}
.abody{margin-top:calc(var(--s)*1.25);padding-left:calc(var(--s)*1.5);
  border-left:1px solid var(--accent-soft);
  font-size:13.5px;line-height:1.6;color:var(--ink-soft);max-width:32rem}
.asp.open{display:flex;flex-direction:column;gap:calc(var(--s)*1.25)}
.asp.open .ab{padding-left:calc(var(--s)*1.5);border-left:1px solid var(--accent-soft);
  font-size:13px;line-height:1.55;color:var(--ink-soft);max-width:32rem}
.asp.open .al{display:block;font:9px/1.7 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.nolens{margin-top:calc(var(--s)*2);font:9.5px/1.6 var(--mono);
  letter-spacing:.1em;color:var(--pl-wrong);opacity:.75}
.tbar button.lit{color:var(--accent);border-color:var(--accent)}
.tbar .tview{color:var(--accent);border-color:var(--accent-soft)}
.tbar.mini{border-style:solid;border-color:var(--line-soft);gap:0;
  padding:5px 7px;width:max-content}
.tbar.mini > *{display:none}
.tbar.mini > .tview{display:inline-block}

.tbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  margin-top:calc(var(--s)*2);padding:calc(var(--s)*1.25);
  border:1px dashed var(--accent-soft);border-radius:2px;background:var(--deep)}
.tbar .tl{font:9px/1.6 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);padding:0 6px 0 2px}
.tbar .tsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.tbar button{font:10px/1.6 var(--mono);letter-spacing:.06em;color:var(--ink-soft);
  background:none;border:1px solid var(--line);border-radius:2px;
  padding:3px 8px;cursor:pointer;transition:color .12s var(--ease),border-color .12s var(--ease)}
.tbar button:hover{color:var(--accent);border-color:var(--accent)}

body{background:var(--pl-sky2)}
#read{background:linear-gradient(var(--pl-sky2) 0%,var(--pl-sky2) 34%,var(--pl-sky) 100%);
  min-height:100dvh}
.field{position:relative;overflow:hidden;
  min-height:calc(100dvh - 13rem);
  margin:calc(var(--s)*3) 0 0;
  width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
  background:none}
.skybar{position:absolute;z-index:2;top:calc(var(--s)*2);left:0;right:0;
  max-width:74rem;margin:0 auto;padding:0 calc(var(--s)*3);
  display:flex;justify-content:flex-start;gap:calc(var(--s)*1.5);pointer-events:none}
.skybar button{pointer-events:auto;font:10px var(--mono);letter-spacing:.14em;
  color:var(--ink-faint);background:none;border:0;padding:3px 2px;cursor:pointer;
  border-bottom:1px solid transparent;
  transition:color .25s ease,border-color .25s ease}
.skybar button:hover{color:var(--ink-soft)}
.skybar button[aria-current=true]{color:var(--ink);border-bottom-color:currentColor}
.skybar button:focus-visible{outline:1px solid var(--ink-soft);outline-offset:2px}
.sky{position:absolute;left:0;right:0;top:0;height:200px;width:100%;display:block;z-index:0}
.land{position:absolute;left:0;right:0;bottom:0;height:236px;width:100%;display:block;z-index:0}
.bed{position:relative;z-index:1;display:grid;
     grid-template-columns:minmax(0,44rem) 170px;justify-content:center;
     gap:calc(var(--s)*5);align-items:stretch;min-height:calc(100dvh - 13rem);
     max-width:74rem;margin:0 auto;padding:0 calc(var(--s)*3)}
.panel{margin:0;padding:calc(var(--s)*4) calc(var(--s)*4) calc(var(--s)*9)}
.side{position:relative;display:flex;align-items:flex-end;justify-content:center}
#plant{width:150px;height:auto;display:block;margin-bottom:-1px}
.leaf{cursor:pointer}
.leaf:focus{outline:none}
.leaf:hover rect,.leaf:focus rect,.leaf.on rect{filter:brightness(1.3)}
.tip{margin-top:calc(var(--s)*2);min-height:4.5rem;
     border-left:1px solid var(--accent-soft);padding-left:calc(var(--s)*1.5)}
.tip .k{font:9px/1.6 var(--mono);letter-spacing:.18em;color:var(--ink-faint);
        text-transform:uppercase}
.tip .s{font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:3px}
.tip .v{font-size:13px;color:var(--ink);margin-top:4px}
.tip .v.bad{color:var(--pl-wrong)}

.q{font-size:17px;line-height:1.5;margin-bottom:calc(var(--s)*3);color:var(--ink);
  text-shadow:0 1px 0 var(--pl-halo),0 0 8px var(--pl-halo),0 0 3px var(--pl-halo)}
.opts{display:flex;flex-direction:column}
.opt{text-shadow:0 1px 0 var(--pl-halo),0 0 7px var(--pl-halo);
     display:block;width:100%;text-align:left;background:none;border:none;
     border-top:1px solid var(--line-soft);padding:calc(var(--s)*1.5) 0;
     font:inherit;font-size:14.5px;color:var(--ink-soft);cursor:pointer;
     position:relative;transition:color .15s var(--ease),padding-left .18s var(--ease)}
.opts .opt:last-child{border-bottom:1px solid var(--line-soft)}
.opt:hover{color:var(--ink);padding-left:5px}
.opt[aria-pressed=true]{color:var(--ink);padding-left:5px}
.opt[aria-pressed=true]::before{content:"";position:absolute;left:-9px;top:50%;
  width:3px;height:1.4rem;background:var(--accent);transform:translateY(-50%)}
.bar{display:flex;justify-content:space-between;align-items:center;
     margin-top:calc(var(--s)*4);gap:var(--s)}
.count{font:10px/1.6 var(--mono);letter-spacing:.14em;color:var(--ink-faint);
  text-shadow:0 0 7px var(--pl-halo)}
.go{font:inherit;font-size:13.5px;background:none;color:var(--ink);
    border:1px solid var(--ink);border-radius:2px;padding:6px 18px;cursor:pointer;
    transition:background .15s var(--ease),color .15s var(--ease)}
.go:hover{background:var(--ink);color:var(--paper)}
.go[disabled]{opacity:.3;cursor:default}
.go[disabled]:hover{background:none;color:var(--ink)}

.item{padding:calc(var(--s)*2) 0;border-top:1px solid var(--line-soft)}
.item .stem{font-size:15px;color:var(--ink);margin-bottom:6px;
  text-shadow:0 1px 0 var(--pl-halo),0 0 7px var(--pl-halo)}
.ln{display:flex;gap:10px;align-items:baseline;font-size:13.5px;margin-top:3px}
.ln dt{flex:0 0 4.6rem;font:9px/1.7 var(--mono);letter-spacing:.14em;
       text-transform:uppercase;color:var(--ink-faint)}
.ln dd{margin:0;color:var(--ink)}
.ln.miss dd{color:var(--pl-wrong)}
.why{font-size:13px;color:var(--ink-soft);margin-top:7px}
.grp{margin-bottom:calc(var(--s)*4)}
.tname{font-size:15px;color:var(--ink);margin-bottom:2px}
.tobj{font:9.5px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:calc(var(--s)*1.25)}
.thin{font:9.5px/1.7 var(--mono);letter-spacing:.08em;color:var(--accent-soft);
  margin:-4px 0 calc(var(--s)*1.25)}
.heldrow{padding:calc(var(--s)*1.25) 0;border-top:1px solid var(--line-soft)}
.grp .heldrow:last-child{border-bottom:1px solid var(--line-soft)}
.grp h3{font:10px/1.7 var(--mono);letter-spacing:.2em;text-transform:uppercase;
        color:var(--ink-faint);margin-bottom:calc(var(--s)*1.5)}
.wk{display:grid;grid-template-columns:auto auto 1fr;gap:5px 12px;
    align-items:baseline;padding:10px 0;border-top:1px solid var(--line-soft)}
.wk .rz{grid-column:1/-1;font-size:13px;color:var(--ink-soft)}
.x{font-variant-numeric:tabular-nums;white-space:nowrap}
.x sup{font-size:.65em;line-height:0;vertical-align:.55em}
.x i{font-style:italic}

@media (max-width:760px){
  .bed{grid-template-columns:1fr;min-height:0}
  .panel{margin:calc(var(--s)*1.5)}
  .side{justify-content:flex-end;padding-right:calc(var(--s)*2)}
}
@media (prefers-reduced-motion:no-preference){
  @keyframes drift{from{transform:translateX(-52px)}to{transform:translateX(256px)}}
  @keyframes flyby{0%{transform:translateX(-28px);opacity:0}3%{opacity:.45}
    13%{opacity:.45}16%{opacity:0}100%{transform:translateX(232px);opacity:0}}
  @keyframes sprout{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
  .cloud{animation:drift 170s linear infinite}
  .cloud.b{animation-duration:225s;animation-delay:-100s}
.wingdn{display:none}
  @keyframes flap{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes flapb{0%,49%{opacity:0}50%,100%{opacity:1}}
  .bird .wingup{animation:flap .42s steps(1) infinite}
  .bird .wingdn{display:inline;animation:flapb .42s steps(1) infinite}
  .bird{animation:flyby 150s linear infinite}
  .bird.b{animation-duration:195s;animation-delay:-75s}
  .bird.c{animation-duration:168s;animation-delay:-120s}
  .bird.b .wingup,.bird.b .wingdn{animation-duration:.36s}
  .bird.c .wingup,.bird.c .wingdn{animation-duration:.5s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.5}}
  .bird.bee{animation-duration:96s}
  .bird.bee .beebody{animation:bob 1.1s ease-in-out infinite}
  .bird.bee .wingup,.bird.bee .wingdn{animation-duration:.14s}
  .bird.firefly{animation-duration:132s}
  .bird.firefly .glow{animation:pulse 2.4s ease-in-out infinite}
  .bird.firefly.b .glow{animation-duration:3.1s;animation-delay:-1s}
  .bird.firefly.c .glow{animation-duration:2s;animation-delay:-.6s}
  .leaf{animation:sprout .5s var(--ease) both;transform-box:fill-box;transform-origin:center}
}
</style>
