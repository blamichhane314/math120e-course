<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>MATH 120E — homework</title>
<link rel=stylesheet href="vendor/katex/katex.min.css">
<link rel=stylesheet href="styles.css?v=3">
<body>
<div id=rail></div>
<div id=read><div id=doc></div></div>
<div id=margin></div>

<script defer src="vendor/katex/katex.min.js"></script>
<script type=module>
import { renderBlocks } from './js/blocks.js?v=3';
import { renderAnswer } from './js/answers.js?v=3';

const ready = () => new Promise(r => window.katex ? r() : addEventListener('load', r));
await ready();

const d = await (await fetch('data/course.json', {cache:'no-store'})).json();
let SOL = {};
try { SOL = await (await fetch('data/solutions.json', {cache:'no-store'})).json(); } catch {}

const rail = document.getElementById('rail');
const doc  = document.getElementById('doc');
const marg = document.getElementById('margin');
const byId = Object.fromEntries(d.sections.map(s => [s.id, s]));
const EXAM = {'Week 4':'exam 1','Week 7':'exam 2','Week 10':'exam 3',
              'Week 13':'exam 4','Week 16':'final'};
const FIG = {graph:'graph', venn:'venn diagram', histogram:'histogram',
             numberline:'number line', table:'table', plane:'coordinate plane'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

rail.innerHTML = '<div class=mast><a href="index.html">math 120e</a>' +
  '<span class=sub>homework</span></div>' +
  d.schedule.map(w => {
    const secs = d.sections.filter(s => s.week === w.week);
    if (!secs.length && !EXAM[w.week]) return '';
    return '<div class=wk><span>' + w.week.toLowerCase() + '</span></div>' +
      (EXAM[w.week] ? '<div class=mark>' + EXAM[w.week] + '</div>' : '') +
      secs.map(s => '<a class=sec href="#/' + s.id + '" data-id="' + s.id + '">' +
        '<span class=n>' + s.id + '</span><span class=t>' +
        esc(s.title.toLowerCase()) + '</span></a>').join('');
  }).join('');

/* ── one section, one problem at a time ──────────────────────────
   A section is thirty problems and a wall of them is read by nobody, so the
   objectives sit at the top as a map and exactly one problem shows beneath,
   stepped with prev/next. The objective a problem serves lights up as you
   move, which means stepping teaches the structure rather than hiding it. */
let cur = null, at = 0;

function renderSection(id, idx) {
  const s = byId[id]; if (!s) return;
  cur = s; at = Math.max(0, Math.min(idx | 0, s.problems.length - 1));
  rail.querySelectorAll('a.sec').forEach(a => a.classList.toggle('on', a.dataset.id === id));

  const K = s.objectives.length;
  const counts = s.objectives.map(() => 0);
  s.problems.forEach(p => (p.objs || []).forEach(j => { if (j < K) counts[j]++; }));

  doc.innerHTML =
    '<h1><span class=num>' + s.id + '</span>' + esc(s.title) + '</h1>' +
    '<div class=meta>' + esc((s.week || '').toLowerCase()) +
      (s.dates ? ' · ' + esc(s.dates.toLowerCase()) : '') +
      ' · ' + (s.track === 'E' ? 'remedial' : 'math 120') +
      ' · ' + s.problems.length + ' problems</div>' +
    '<h2>objectives</h2><div id=objmap>' +
      s.objectives.map((o, j) =>
        '<div class=omap data-o="' + j + '"><span class=oi>O' + (j + 1) + '</span>' +
        '<span class=ot>' + esc(o) + '</span>' +
        '<span class=oc>' + (counts[j] || '&mdash;') + '</span></div>').join('') +
    '</div><div id=stage></div>';

  document.getElementById('objmap').addEventListener('click', e => {
    const t = e.target.closest('.omap'); if (!t) return;
    const j = +t.getAttribute('data-o');
    const i = s.problems.findIndex(p => (p.objs || []).includes(j));
    if (i >= 0) step(i);
  });
  paint();
  document.title = 'math 120e · ' + s.id + ' ' + s.title;
  document.getElementById('read').scrollTop = 0;
}

function step(i) {
  const n = cur.problems.length;
  at = (i + n) % n;
  paint();
  location.replace('#/' + cur.id + '/' + (at + 1));
}

function paint() {
  const s = cur, p = s.problems[at];
  const stage = document.getElementById('stage'); if (!stage) return;

  stage.innerHTML =
    '<div class=stepper>' +
      '<button class=sbtn id=sprev>&lsaquo;&nbsp;prev</button>' +
      '<span class=spos>' + (at + 1) + ' <i>/</i> ' + s.problems.length + '</span>' +
      '<button class=sbtn id=snext>next&nbsp;&rsaquo;</button>' +
    '</div><div class=rows><div class=prob id=card></div></div>';

  const card = document.getElementById('card');
  card.innerHTML =
    '<div class=ptop><span class=pid>' + esc(p.pid) + '</span>' +
    '<span class=stem>' + esc(p.kind || '') + '</span>' +
    (p.structure || []).filter(x => x !== 'math' && x !== 'none')
      .map(x => '<span class=kind>' + esc(FIG[x] || x) + '</span>').join('') +
    '</div><div class=pbody id=pb></div>';

  const body = document.getElementById('pb');
  if (p.stem && p.stem.length) {
    try {
      renderBlocks(p.stem, body);
      if (p.answer) body.appendChild(renderAnswer(p.answer, { onChange() {} }));
    } catch (e) {
      body.innerHTML = '<div class=a-unknown>could not render this problem</div>';
    }
  } else {
    body.innerHTML = '<div class=pr-thin>this section is not converted yet</div>';
  }

  if (p.clipped) {
    const c = document.createElement('div');
    c.className = 'clip';
    c.innerHTML = '<span class=t>clipped in source</span>' +
      esc(p.note || 'content runs off the right page margin');
    card.appendChild(c);
  }

  document.getElementById('sprev').onclick = () => step(at - 1);
  document.getElementById('snext').onclick = () => step(at + 1);

  document.querySelectorAll('.omap').forEach(n =>
    n.classList.toggle('on', (p.objs || []).includes(+n.getAttribute('data-o'))));

  const others = p.objs || [];
  marg.innerHTML = others.length > 1
    ? '<div class=mk><span class=kind>also serves</span><div class=body>' +
      others.map(j => '<b>O' + (j + 1) + '</b> &middot; ' + esc(s.objectives[j] || ''))
        .join('<br>') + '</div></div>'
    : '';
}

addEventListener('keydown', e => {
  if (!cur || /input|select|textarea/i.test(e.target.tagName || '')) return;
  if (e.key === 'ArrowRight') step(at + 1);
  else if (e.key === 'ArrowLeft') step(at - 1);
});

function route() {
  const h = location.hash.replace(/^#\/?/, '').trim();
  if (!h) { renderSection(d.sections[0].id, 0); return; }
  const [id, n] = h.split('/');
  const want = n ? parseInt(n, 10) - 1 : 0;
  if (cur && cur.id === id) {
    if (want !== at) { at = Math.max(0, Math.min(want, cur.problems.length - 1)); paint(); }
    return;
  }
  renderSection(id, want || 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
