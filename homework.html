<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>MATH 120E — homework</title>
<link rel=stylesheet href="vendor/katex/katex.min.css">
<link rel=stylesheet href="styles.css?v=28">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("m120.theme")||"ink"}catch(e){}</script>
<body class=hw>
<div id=rail></div>
<div id=read><div id=doc></div></div>
<div id=margin></div>

<script defer src="vendor/katex/katex.min.js"></script>
<script type=module>
import { renderBlocks, inline } from './js/blocks.js?v=4';
import { renderAnswer } from './js/answers.js?v=5';

const ready = () => new Promise(r => window.katex ? r() : addEventListener('load', r));
await ready();

const d = await (await fetch('data/course.json', {cache:'no-store'})).json();
// Practice questions written for this course. The assignments are in MyLab;
// these cover the same objectives.
let Q = {};
for (const f of ['q_a','q_b','q_c']) {
  try { Object.assign(Q, await (await fetch('data/' + f + '.json', {cache:'no-store'})).json()); }
  catch {}
}
// The named rules an objective asks a student to know. Written for chapter 1;
// a section with no entry simply shows nothing.
let FACTS = {};
try { FACTS = await (await fetch('data/facts.json', {cache:'no-store'})).json(); } catch {}

document.body.classList.add('no-margin');
const rail = document.getElementById('rail');
const doc  = document.getElementById('doc');
const marg = document.getElementById('margin');
const byId = Object.fromEntries(d.sections.map(s => [s.id, s]));
const EXAM = {'Week 4':'exam 1','Week 7':'exam 2','Week 10':'exam 3',
              'Week 13':'exam 4','Week 16':'final'};
const FIG = {graph:'graph', venn:'venn diagram', histogram:'histogram',
             numberline:'number line', table:'table', plane:'coordinate plane'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

rail.innerHTML = '<div class=mast><a href="index.html">math 120e</a>' +
  '<span class=sub>homework</span></div>' +
  d.schedule.map(w => {
    const secs = d.sections.filter(s => s.week === w.week);
    if (!secs.length && !EXAM[w.week]) return '';
    return '<div class=wk><span>' + w.week.toLowerCase() + '</span></div>' +
      (EXAM[w.week] ? '<div class=mark>' + EXAM[w.week] + '</div>' : '') +
      secs.map(s => '<a class=sec href="#/' + s.id + '" data-id="' + s.id + '">' +
        '<span class=n>' + s.id + '</span><span class=t>' +
        esc(s.title.toLowerCase()) + '</span></a>').join('');
  }).join('');

/* ── one section, one question at a time ─────────────────────────
   The objectives sit at the top and one question shows beneath, stepped with
   prev/next. The objective a question serves is highlighted as you move. */
let cur = null, at = 0, qs = [];

function renderSection(id, idx) {
  const s = byId[id]; if (!s) return;
  cur = s;
  qs = (Q[s.id] || []).slice().sort((x, y) =>
    String(x.obj).localeCompare(String(y.obj), undefined, {numeric:true}) ||
    String(x.id).localeCompare(String(y.id), undefined, {numeric:true}));
  at = Math.max(0, Math.min(idx | 0, Math.max(qs.length - 1, 0)));
  rail.querySelectorAll('a.sec').forEach(a => a.classList.toggle('on', a.dataset.id === id));

  const K = s.objectives.length;
  const counts = s.objectives.map((_, j) =>
    qs.filter(q => q.obj === s.id + '/O' + (j + 1)).length);
  const assigned = s.problems.length;

  doc.innerHTML =
    '<h1><span class=num>' + s.id + '</span>' + esc(s.title) + '</h1>' +
    '<div class=meta>' + esc((s.week || '').toLowerCase()) +
      (s.dates ? ' · ' + esc(s.dates.toLowerCase()) : '') +
      ' · ' + (s.track === 'E' ? 'remedial' : 'math 120') +
      ' · ' + qs.length + ' practice question' + (qs.length === 1 ? '' : 's') +
      '</div>' +
    '<h2>objectives</h2><div id=objmap>' +
      s.objectives.map((o, j) =>
        '<div class=omap data-o="' + j + '"><span class=oi>O' + (j + 1) + '</span>' +
        '<span class=ot>' + esc(o) + '</span>' +
        '<span class=oc>' + (counts[j] || '&mdash;') + '</span></div>').join('') +
    '</div>' + knowBlock(s) + '<div id=stage></div>' +
    '<h2>the assignment</h2><div class=note><p>Your ' + assigned +
      ' assigned problems for this section are in MyLab. The practice above ' +
      'covers the same objectives. It is not the assignment and is not graded.</p></div>';

  document.getElementById('objmap').addEventListener('click', e => {
    const t = e.target.closest('.omap'); if (!t) return;
    const j = +t.getAttribute('data-o');
    const i = qs.findIndex(q => q.obj === s.id + '/O' + (j + 1));
    if (i >= 0) step(i);
  });
  paint();
  document.title = 'math 120e · ' + s.id + ' ' + s.title;
  document.getElementById('read').scrollTop = 0;
}

/* ── what the section asks you to know ─────────────────────────────
   An inventory, not notes: the named properties, rules and formulas, each
   with its statement, under the objective that needs it. It is what a student
   can look at before the first problem and know what is coming. */
function knowBlock(s) {
  const rows = s.objectives.map((o, j) => {
    const items = FACTS[s.id + '/O' + (j + 1)];
    if (!items || !items.length) return '';
    return '<div class=kn-obj>' +
      '<div class=kn-h><span class=kn-i>O' + (j + 1) + '</span>' + esc(o) + '</div>' +
      items.map((f) =>
        '<div class=kn-f>' +
          '<div class=kn-n>' + inline(f.name) + '</div>' +
          '<div class=kn-s>' + inline(f.statement) + '</div>' +
          (f.note ? '<div class=kn-note>' + inline(f.note) + '</div>' : '') +
        '</div>').join('') +
      '</div>';
  }).join('');
  if (!rows) return '';
  const n = s.objectives.reduce((a, _, j) =>
    a + ((FACTS[s.id + '/O' + (j + 1)] || []).length), 0);
  return '<details id=know open>' +
    '<summary><span class=kn-t>what you need to know</span>' +
    '<span class=kn-c>' + n + '</span></summary>' + rows + '</details>';
}

function step(i) {
  if (!qs.length) return;
  at = (i + qs.length) % qs.length;
  paint();
  location.replace('#/' + cur.id + '/' + (at + 1));
}

function paint() {
  const s = cur;
  const stage = document.getElementById('stage'); if (!stage) return;

  if (!qs.length) {
    stage.innerHTML = '<div class=note><p>Practice for this section has not been ' +
      'written yet.</p></div>';
    marg.innerHTML = '';
    return;
  }

  const q = qs[at];
  stage.innerHTML =
    '<div class=stepper>' +
      '<button class=sbtn id=sprev>&lsaquo;&nbsp;prev</button>' +
      '<span class=spos>' + (at + 1) + ' <i>/</i> ' + qs.length + '</span>' +
      '<button class=sbtn id=snext>next&nbsp;&rsaquo;</button>' +
      '<button class=sbtn id=sshow>show the reasoning</button>' +
    '</div><div class=rows><div class=prob id=card></div></div>';

  const card = document.getElementById('card');
  card.innerHTML =
    '<div class=ptop><span class=pid>' + esc(q.obj) + '</span>' +
    '<span class=stem>' + esc(q.kind || '') + '</span>' +
    (q.level === 'stretch' ? '<span class=kind>stretch</span>' : '') +
    '</div><div class=pbody id=pb></div>';

  const body = document.getElementById('pb');
  try {
    if (q.stem && q.stem.length) renderBlocks(q.stem, body);
    if (q.answer) body.appendChild(renderAnswer(q.answer, { onChange() {} }));
  } catch (e) {
    body.innerHTML = '<div class=a-unknown>could not render this question</div>';
  }

  const why = document.createElement('div');
  why.className = 'why';
  why.hidden = true;
  why.innerHTML = '<span class=t>reasoning</span>' + esc(q.why || '') +
    (q.key !== undefined ? '<span class=k>answer: ' + esc(q.key) + '</span>' : '');
  card.appendChild(why);
  document.getElementById('sshow').onclick = () => { why.hidden = !why.hidden; };

  document.getElementById('sprev').onclick = () => step(at - 1);
  document.getElementById('snext').onclick = () => step(at + 1);

  const j = parseInt(String(q.obj).split('/O')[1], 10) - 1;
  document.querySelectorAll('.omap').forEach(n =>
    n.classList.toggle('on', +n.getAttribute('data-o') === j));
  marg.innerHTML = '';
}

addEventListener('keydown', e => {
  if (!cur || /input|select|textarea/i.test(e.target.tagName || '')) return;
  if (e.key === 'ArrowRight') step(at + 1);
  else if (e.key === 'ArrowLeft') step(at - 1);
});

function route() {
  const h = location.hash.replace(/^#\/?/, '').trim();
  if (!h) { renderSection(d.sections[0].id, 0); return; }
  const [id, n] = h.split('/');
  const want = n ? parseInt(n, 10) - 1 : 0;
  if (cur && cur.id === id) {
    if (want !== at) { at = Math.max(0, Math.min(want, Math.max(qs.length - 1, 0))); paint(); }
    return;
  }
  renderSection(id, want || 0);
}
addEventListener('hashchange', route);
route();
</script>
<script type=module>
import { mountThemes } from './js/theme.js?v=2';
mountThemes();
</script>
</body>
</html>
